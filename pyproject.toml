[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "icarus-market-matcher"
version = "0.1.0"
description = "Deterministic and AI-assisted market pairing for ICARUS"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
]
ai = [
  "openai>=1.68,<3",
  "pydantic>=2.7,<3",
]
all = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "openai>=1.68,<3",
  "pydantic>=2.7,<3",
]
test = ["pytest>=8.0,<9"]

[project.scripts]
icarus-match = "icarus_matcher.__main__:main"

[tool.setuptools]
package-dir = {"" = "matcher"}

[tool.setuptools.packages.find]
where = ["matcher"]

[tool.pytest.ini_options]
testpaths = ["matcher/tests"]
addopts = "-q"

